<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Noto Sans, DejaVu Sans, sans-serif">
<defs><marker id="a0F172A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="a475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="aDC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="a059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="aEA4B71" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EA4B71"/></marker><marker id="a2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="a7C3AED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="aD97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs>
<text x="450.0" y="22" font-size="13" fill="#0F172A" text-anchor="middle" font-weight="600" font-style="normal">Untrusted email  →  must pass every layer before anything happens</text>
<rect x="30" y="40" width="840" height="270" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="46" y="62" font-size="12" fill="#0F172A" text-anchor="start" font-weight="600" font-style="normal">1  Prompt: the email is data inside &lt;email&gt; tags; instructions in it are ignored</text>
<rect x="56" y="74" width="788" height="226" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.4"/>
<text x="72" y="96" font-size="12" fill="#0F172A" text-anchor="start" font-weight="600" font-style="normal">2  Escaping: a &lt;/email&gt; in the email can&#x27;t close the data block</text>
<rect x="82" y="108" width="736" height="182" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
<text x="98" y="130" font-size="12" fill="#0F172A" text-anchor="start" font-weight="600" font-style="normal">3  Structured output: only enum labels and short text can come back</text>
<rect x="108" y="142" width="684" height="138" rx="14" fill="#D1FAE5" stroke="#059669" stroke-width="1.4"/>
<text x="124" y="164" font-size="12" fill="#0F172A" text-anchor="start" font-weight="600" font-style="normal">4  No tools: the model can&#x27;t act; code decides routes (D4)</text>
<rect x="134" y="176" width="632" height="94" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
<text x="150" y="198" font-size="12" fill="#0F172A" text-anchor="start" font-weight="600" font-style="normal">5  Heuristic: suspicious phrasing forces human review</text>
<rect x="160" y="210" width="580" height="50" rx="12" fill="white" stroke="#0F172A" stroke-width="1.4"/>
<text x="450.0" y="240.0" font-size="12" fill="#0F172A" text-anchor="middle" font-weight="600" font-style="normal">Worst case of a successful injection: a wrong label → still bounded by routing code</text>
</svg>
